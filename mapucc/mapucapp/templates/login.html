<h1>Login</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label>Nome de Usuário:</label>
        <input type="text" name="username">
    </div>

    <div>
        <label>Senha:</label>
        <input type="password" name="password">
    </div>

    <input type="submit" value="Entrar">
</form>
