{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de filmes</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="header">
        <svg style="color: white;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-film size-5 text-primary-foreground" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M7 3v18"></path><path d="M3 7.5h4"></path><path d="M3 12h18"></path><path d="M3 16.5h4"></path><path d="M17 3v18"></path><path d="M17 7.5h4"></path><path d="M17 16.5h4"></path></svg>
        <span>Lumière</span>
    </div>

    <div class="page-container">
        <div class="catalog-header">
            <h1>Catálogo de filmes</h1>
            <a href="{% url 'movie_create' %}" class="btn btn-primary">Registrar novo filme</a>
        </div>

        <div class="catalog">
            {% for movie in movies %}
            <div class="card">
                <img src="{{ movie.image_url }}" alt="{{ movie.title }}" class="card-img-top">
                <div class="card-body">
                    <h5>{{ movie.title }}</h5>
                    <p>{{ movie.description }}</p>
                    <div class="card-actions">
                        <a href="{% url 'movie_update' movie.pk %}" class="btn btn-secondary">Atualizar</a>
                        <a href="{% url 'movie_delete' movie.pk %}" class="btn btn-danger">Deletar</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="empty-state">Nenhum filme cadastrado ainda.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
